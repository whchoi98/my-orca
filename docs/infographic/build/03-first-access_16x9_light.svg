<text x="269.4" y="655.2" font-size="14.5" font-weight="700" fill="#2E3A4A" data-box="48,466,896,578">그 밖의 요청, WebSocket</text>
<text x="533.6" y="655.2" font-size="14.5" font-weight="700" fill="#2E3A4A" data-box="48,466,896,578">503</text>
