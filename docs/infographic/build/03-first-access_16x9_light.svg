<text x="269.4" y="1000.2" font-size="14.5" font-weight="700" fill="#2E3A4A" data-box="48,466,896,578">모든 요청</text>
<text x="533.6" y="1000.2" font-size="14.5" font-weight="700" fill="#2E3A4A" data-box="48,466,896,578">게이트 쿠키를 빼고 오리진으로 전달</text>
