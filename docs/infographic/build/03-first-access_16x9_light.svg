<text x="269.4" y="712.8" font-size="14.5" font-weight="700" fill="#2E3A4A" data-box="48,466,896,578">POST /__gate/setup</text>
<text x="533.6" y="712.8" font-size="14.5" font-weight="700" fill="#2E3A4A" data-box="48,466,896,578">설정 서비스로 전달, 다른 메서드는 405</text>
