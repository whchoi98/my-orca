<text x="1022.0" y="506.0" data-box="964,466,908,578"><tspan font-size="21" font-weight="800" fill="#232F3E" letter-spacing="0.2">다시 받을 때와 바꿀 때</tspan><tspan font-size="15" font-weight="700" fill="#5F6B7A" dx="14">명령은 저장소 루트에서 실행</tspan></text>
