<text x="269.4" y="885.2" font-size="14.5" font-weight="700" fill="#2E3A4A" data-box="48,466,896,578">쿠키 없는 요청</text>
<text x="533.6" y="885.2" font-size="14.5" font-weight="700" fill="#2E3A4A" data-box="48,466,896,578">401, HTML 요청에는 로그인 화면</text>
<line x1="70.0" y1="909.0" x2="922.0" y2="909.0" stroke="#DFE4EA" stroke-width="1" stroke-linecap="round"/>
<text x="82.0" y="942.8" font-size="14.5" font-weight="800" fill="#232F3E" data-box="48,466,896,578">암호를 정한 뒤</text>
