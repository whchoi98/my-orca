<text x="269.4" y="827.8" font-size="14.5" font-weight="700" fill="#2E3A4A" data-box="48,466,896,578">POST /__gate/login</text>
<text x="533.6" y="827.8" font-size="14.5" font-weight="700" fill="#2E3A4A" data-box="48,466,896,578">암호가 맞으면 204와 쿠키, 틀리면 401</text>
