<text x="998.0" y="554.0" font-size="12.5" font-weight="800" fill="#5F6B7A" data-box="964,466,908,578">상황</text>
<text x="1309.0" y="554.0" font-size="12.5" font-weight="800" fill="#5F6B7A" data-box="964,466,908,578">방법</text>
<text x="998.0" y="596.7" font-size="14.5" font-weight="800" fill="#232F3E" data-box="964,466,908,578">서버를 재시작해 링크가 바뀜</text>
<text x="1309.0" y="596.7" font-size="14.5" font-weight="700" fill="#2E3A4A" data-box="964,466,908,578">bash get_pairing_url.sh</text>
